<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>JDCC Shift A Schedule</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: white;
    }

    #viewer {
      position: fixed;
      inset: 0;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      background: white;
    }

    #schedule {
      position: absolute;
      top: 0;
      left: 0;
      width: 1650px;
      height: 1800px;
      border: 0;
      transform-origin: top left;
    }
  </style>
</head>

<body>

  <div id="viewer">
    <iframe
      id="schedule"
      src="https://1drv.ms/x/c/53a5f839f0798ecf/IQSOzO4WcyvLT5tvWQ1aAzDpAbXxAIigXprsZ6DPB5n3cqQ?wdAllowInteractivity=False&Item=%27Shift%20A%20-%20Schedule%27!A1%3AAM82&wdHideGridlines=True&wdHideHeaders=True&wdHideSheetTabs=True"
      allowfullscreen>
    </iframe>
  </div>

  <script>
    const BASE_WIDTH = 1650;
    const BASE_HEIGHT = 1800;

    function resizeSchedule() {
      const iframe = document.getElementById("schedule");

      const availableWidth =
        document.documentElement.clientWidth || window.innerWidth;

      const scale = Math.min(availableWidth / BASE_WIDTH, 1);

      iframe.style.width = BASE_WIDTH + "px";
      iframe.style.height = BASE_HEIGHT + "px";
      iframe.style.transform = "scale(" + scale + ")";

      document.getElementById("viewer").style.width = "100vw";
      document.getElementById("viewer").style.height = "100dvh";
    }

    resizeSchedule();

    window.addEventListener("resize", resizeSchedule);

    window.addEventListener("orientationchange", function () {
      setTimeout(resizeSchedule, 300);
    });
  </script>

</body>
</html>
